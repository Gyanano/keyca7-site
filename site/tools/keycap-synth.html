<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KeyCat — 机械键轴手感实验室</title>
  <style>
    :root {
      --paper: #f6f1e7;
      --paper-card: #fbf8f1;
      --ink: #1f1d1a;
      --muted: #6d665c;
      --accent: #e24a2b;
      --line: rgba(31, 29, 26, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Serif SC", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      overflow: hidden;
    }
    canvas#fx {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }
    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 560px;
      background: var(--paper-card);
      border: 1.5px solid var(--ink);
      border-radius: 22px;
      padding: 36px 28px 30px;
      box-shadow: 6px 6px 0 rgba(31, 29, 26, 0.08);
      text-align: center;
    }
    .tag {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--accent);
      border: 1px dashed var(--accent);
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 600;
    }
    p {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 14px;
    }
    .stage {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 0 30px;
    }
    .keycap-btn {
      position: relative;
      width: 132px;
      height: 132px;
      border: none;
      background: transparent;
      cursor: pointer;
      outline: none;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .keycap-base {
      position: absolute;
      inset: 8px 0 0 0;
      border-radius: 26px;
      background: #9f2d17;
      border: 2px solid var(--ink);
      box-shadow: 0 10px 0 rgba(31, 29, 26, 0.16);
    }
    .keycap-top {
      position: absolute;
      inset: 0 6px 14px 6px;
      border-radius: 20px;
      background: linear-gradient(145deg, #ee5b3c 0%, #d94323 100%);
      border: 2px solid var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fffaf3;
      transition: transform 0.07s cubic-bezier(0.2, 0.9, 0.3, 1);
      box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.28);
    }
    .keycap-btn.pressed .keycap-top {
      transform: translateY(10px);
    }
    .keycap-top svg {
      width: 48px;
      height: 48px;
      margin-bottom: 4px;
    }
    .keycap-top span {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      opacity: 0.92;
    }
    .switches {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .switches button {
      border: 1.2px solid var(--line);
      background: #fffdf8;
      color: var(--ink);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .switches button.active {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }
    .stats {
      display: flex;
      justify-content: center;
      gap: 24px;
      font-size: 13px;
      color: var(--muted);
      border-top: 1px dashed var(--line);
      padding-top: 16px;
    }
    .stats strong {
      color: var(--accent);
      font-family: ui-monospace, monospace;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <canvas id="fx"></canvas>
  <main class="card">
    <div class="tag">VIBECODING TOOL · 02</div>
    <h1>橙红键帽 · 机械轴声实验室</h1>
    <p>点击键帽或按下键盘 <strong>Space / Enter</strong>，纯 Web Audio 实时合成不同机械轴手感</p>

    <div class="stage">
      <button class="keycap-btn" id="keycap" aria-label="Press KeyCat Keycap">
        <div class="keycap-base"></div>
        <div class="keycap-top">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <rect x="14" y="14" width="36" height="36" rx="8" />
            <circle cx="32" cy="32" r="5" />
            <path d="M32 14v9M32 41v9M14 32h9M41 32h9M20 20l5 5M39 39l5 5" />
          </svg>
          <span>KEYCAT</span>
        </div>
      </button>
    </div>

    <div class="switches" id="switchGroup">
      <button data-sw="thock" class="active">麻将音 Thock</button>
      <button data-sw="tactile">段落茶轴 Tactile</button>
      <button data-sw="clicky">清脆青轴 Clicky</button>
      <button data-sw="linear">轻盈红轴 Linear</button>
    </div>

    <div class="stats">
      <div>累计敲击 <strong id="count">0</strong></div>
      <div>当前轴体 <strong id="swName">Thock</strong></div>
    </div>
  </main>

  <script>
    const keycap = document.getElementById("keycap");
    const countEl = document.getElementById("count");
    const swNameEl = document.getElementById("swName");
    const canvas = document.getElementById("fx");
    const ctx = canvas.getContext("2d");

    let audioCtx = null;
    let currentSwitch = "thock";
    let pressCount = 0;
    const sparks = [];

    function resize() {
      canvas.width = window.innerWidth * devicePixelRatio;
      canvas.height = window.innerHeight * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    function playSwitchSound(type) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      // Short filtered noise burst for authentic keycap bottom-out
      const bufSize = Math.floor(audioCtx.sampleRate * 0.045);
      const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.25));
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buf;
      const nGain = audioCtx.createGain();
      const nFilter = audioCtx.createBiquadFilter();

      if (type === "thock") {
        osc.type = "triangle";
        osc.frequency.setValueAtTime(190, now);
        osc.frequency.exponentialRampToValueAtTime(68, now + 0.055);
        gain.gain.setValueAtTime(0.32, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.065);
        nFilter.type = "lowpass";
        nFilter.frequency.setValueAtTime(1100, now);
        nGain.gain.setValueAtTime(0.26, now);
        nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
      } else if (type === "tactile") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(340, now);
        osc.frequency.exponentialRampToValueAtTime(110, now + 0.04);
        gain.gain.setValueAtTime(0.24, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        nFilter.type = "bandpass";
        nFilter.frequency.setValueAtTime(1800, now);
        nGain.gain.setValueAtTime(0.22, now);
        nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
      } else if (type === "clicky") {
        osc.type = "square";
        osc.frequency.setValueAtTime(1400, now);
        osc.frequency.exponentialRampToValueAtTime(320, now + 0.025);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
        nFilter.type = "highpass";
        nFilter.frequency.setValueAtTime(2600, now);
        nGain.gain.setValueAtTime(0.28, now);
        nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.025);
      } else {
        osc.type = "sine";
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(90, now + 0.035);
        gain.gain.setValueAtTime(0.16, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
        nFilter.type = "lowpass";
        nFilter.frequency.setValueAtTime(900, now);
        nGain.gain.setValueAtTime(0.12, now);
        nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
      }

      filter.type = "lowpass";
      filter.frequency.setValueAtTime(2200, now);
      osc.connect(filter).connect(gain).connect(audioCtx.destination);
      noise.connect(nFilter).connect(nGain).connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.08);
      noise.start(now);
    }

    function spawnSparks() {
      const rect = keycap.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      for (let i = 0; i < 10; i++) {
        const ang = (Math.PI * 2 * i) / 10 + (Math.random() - 0.5) * 0.4;
        const speed = 3.2 + Math.random() * 4.5;
        sparks.push({
          x: cx + Math.cos(ang) * 44,
          y: cy + Math.sin(ang) * 44,
          vx: Math.cos(ang) * speed,
          vy: Math.sin(ang) * speed,
          life: 1,
          len: 10 + Math.random() * 14,
          color: i % 3 === 0 ? "#1f1d1a" : "#e24a2b",
        });
      }
    }

    function animate() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.x += s.vx;
        s.y += s.vy;
        s.vx *= 0.92;
        s.vy *= 0.92;
        s.life -= 0.045;
        if (s.life <= 0) {
          sparks.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = s.life;
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 2.6 * s.life;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x - s.vx * 2.2, s.y - s.vy * 2.2);
        ctx.stroke();
        ctx.restore();
      }
      requestAnimationFrame(animate);
    }
    animate();

    function triggerPress() {
      keycap.classList.add("pressed");
      pressCount++;
      countEl.textContent = pressCount;
      playSwitchSound(currentSwitch);
      spawnSparks();
      setTimeout(() => keycap.classList.remove("pressed"), 110);
    }

    keycap.addEventListener("pointerdown", triggerPress);
    window.addEventListener("keydown", (e) => {
      if ((e.code === "Space" || e.code === "Enter") && !e.repeat) {
        e.preventDefault();
        triggerPress();
      }
    });

    document.querySelectorAll("#switchGroup button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#switchGroup button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentSwitch = btn.dataset.sw;
        swNameEl.textContent = btn.dataset.sw.charAt(0).toUpperCase() + btn.dataset.sw.slice(1);
        triggerPress();
      });
    });
  </script>
</body>
</html>
